<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generador de Diamantes Free Fire</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* --- Estilos con fondo desenfocado --- */
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        position: relative;
        overflow-x: hidden;
        background: #111;
        font-family: 'Poppins', sans-serif;
      }
      body::before {
        content: "";
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        background: url('https://blogger.googleusercontent.com/img/a/AVvXsEjW_99qQJmWOu651lNJxwoTWEC33IJPMHmFSiHye8WZ7ygvOe_wXvZpfgMcc_YePmOuH__fIeNxSYHDO7KXourn1ZunmjcxfROzsv2Bn_TXAghfsw7AW_GCBGQyFtv1QhCfrQh8iJ2tr6KJYMXjfOg9mPW51ewmEZU_vPurV_njXdwDr2QUGBgbQd-TEOk') center center/cover no-repeat fixed;
        filter: blur(8px);
        z-index: 0;
        pointer-events: none;
      }
      body::after {
        content: "";
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        background: rgba(0,0,0,0.45);
        z-index: 1;
        pointer-events: none;
      }
      .container {
        max-width: 420px;
        margin: 6vw auto;
        padding: 40px 30px;
        background: rgba(30, 30, 38, 0.9);
        border-radius: 20px;
        box-shadow: 0 10px 35px rgba(0,0,0,0.7);
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        border: 1px solid rgba(255,255,255,0.1);
        backdrop-filter: blur(6px);
      }
      .title {
        font-size: 36px;
        font-weight: 700;
        color: #f5f7fa;
        letter-spacing: 1px;
        margin-bottom: 25px;
        text-align: center;
        user-select: none;
        transition: color 0.3s ease;
      }
      .input-container {
        width: 100%;
        margin-bottom: 25px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .input-container label {
        width: 100%;
        font-weight: 600;
        font-size: 1.1rem;
        color: #d1d5db;
        margin-bottom: 8px;
        user-select: none;
        text-align: left;
        letter-spacing: 0.2px;
      }
      .input-container input {
        width: 100%;
        padding: 14px 16px;
        font-size: 1rem;
        border-radius: 12px;
        border: 1.5px solid #4b5563;
        background: rgba(75, 85, 99, 0.2);
        color: #f9fafb;
        text-align: center;
        box-shadow: inset 0 1px 6px rgba(0,0,0,0.5);
        outline: none;
        transition: border-color 0.3s ease, background 0.3s ease;
      }
      .input-container input::placeholder {
        color: #9ca3af;
      }
      .input-container input:focus {
        background: rgba(75, 85, 99, 0.35);
        border-color: #2563eb;
        box-shadow: 0 0 8px #2563eb;
        color: #ffffff;
      }
      .option {
        width: 100%;
        padding: 15px 20px;
        margin: 12px 0;
        background: #1f2937;
        border-radius: 14px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        color: #e0e7ff;
        font-weight: 600;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        user-select: none;
        transition: background-color 0.3s ease, box-shadow 0.3s ease;
        border: 1px solid transparent;
      }
      .option:hover, .option.active {
        background: #2563eb;
        box-shadow: 0 6px 20px rgba(37, 99, 235, 0.7);
        color: #f3f4f6;
        border-color: #60a5fa;
        transform: translateY(-2px);
      }
      .diamante-icon {
        font-size: 22px;
        color: #60a5fa;
        filter: drop-shadow(0 0 2px #3b82f6);
        animation: pulse 2s infinite;
        user-select: none;
      }
      @keyframes pulse {
        0%, 100% { filter: drop-shadow(0 0 2px #3b82f6); }
        50% { filter: drop-shadow(0 0 8px #60a5fa); }
      }
      .counter-animate {
        font-weight: 700;
        color: #fbbf24;
        font-family: 'Poppins', monospace, monospace;
        font-size: 1rem;
        min-width: 75px;
        text-align: right;
        transition: color 0.3s ease;
        user-select: none;
      }
      .slider-container {
        position: relative;
        width: 44px;
        height: 24px;
        margin-left: 12px;
        flex-shrink: 0;
      }
      .slider-container input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        cursor: pointer;
        top: 0; left: 0; right: 0; bottom: 0;
        background: #374151;
        border-radius: 9999px;
        transition: background-color 0.3s ease;
        box-shadow: inset 0 0 5px rgba(0,0,0,0.6);
      }
      .slider:before {
        position: absolute;
        content: "";
        height: 18px;
        width: 18px;
        left: 3px;
        bottom: 3px;
        background: #e0e7ff;
        border-radius: 9999px;
        transition: transform 0.3s ease;
        box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      }
      input:checked + .slider {
        background: #2563eb;
        box-shadow: 0 0 8px rgba(37, 99, 235, 0.7);
      }
      input:checked + .slider:before {
        transform: translateX(20px);
        background: #bfdbfe;
        box-shadow: 0 0 10px #3b82f6;
      }
      @media (max-width: 540px) {
        .container { padding: 30px 20px; }
        .title { font-size: 28px; }
        .option { font-size: 16px; padding: 12px 16px; }
        .diamante-icon { font-size: 18px; }
        .counter-animate { font-size: 0.9rem; min-width: 60px; }
      }


      /* --- Botón y Modal --- */
      .generate-btn {
        margin-top: 25px;
        padding: 14px 30px;
        background: linear-gradient(45deg, #2563eb, #1d4ed8);
        color: white;
        font-size: 1.1rem;
        font-weight: 600;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(37,99,235,0.5);
        transition: transform 0.2s ease, box-shadow 0.3s ease;
      }
      .generate-btn:hover {
        transform: scale(1.05);
        box-shadow: 0 6px 20px rgba(37,99,235,0.7);
      }
      .modal {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.6);
        justify-content: center;
        align-items: center;
        z-index: 999;
      }
      .modal-content {
        background: #1f2937;
        padding: 30px;
        border-radius: 15px;
        text-align: center;
        color: white;
        width: 320px;
      }
      .loader {
        border: 4px solid #374151;
        border-top: 4px solid #3b82f6;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        margin: 15px auto;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { 100% { transform: rotate(360deg); } }
      .success-icon {
        font-size: 40px;
        color: #10b981;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 class="title">Generador de Diamantes</h1>
      <div class="input-container">
        <label for="userID">ID de Free Fire:</label>
        <input
          type="text"
          id="userID"
          placeholder="Ingresa tu ID de Free Fire"
        />
      </div>
      <div id="options"></div>

      <!-- Botón -->
      <button class="generate-btn" id="generateBtn">Generar</button>
    </div>

    <!-- Modal -->
    <div class="modal" id="processModal">
      <div class="modal-content" id="modalContent">
        <div class="loader"></div>
        <p id="modalText">Buscando ID...</p>
      </div>
    </div>

    <script>
      const diamantes = [10000, 20000, 50000, 100000, 200000, 500000, 999999999 ];
      const optionsDiv = document.getElementById("options");

      diamantes.forEach(cantidad => {
        const div = document.createElement("div");
        div.classList.add("option");
        div.innerHTML = `
          <span><span class="diamante-icon">💎</span>${cantidad.toLocaleString()}
            <span id="counter-${cantidad}" class="counter-animate">0</span>
          </span>
          <label class="slider-container">
            <input type="checkbox" id="switch-${cantidad}">
            <span class="slider"></span>
          </label>
        `;
        optionsDiv.appendChild(div);

        const switchElement = div.querySelector('input[type="checkbox"]');
        const counterElement = div.querySelector(`#counter-${cantidad}`);
        let animationFrameId = null;

        function animateCounterFixed(start, end, duration) {
          if (animationFrameId) cancelAnimationFrame(animationFrameId);
          let startTime;
          function easeOutExpo(x) { return x === 1 ? 1 : 1 - Math.pow(2, -10 * x); }
          function animate(currentTime) {
            if (!startTime) startTime = currentTime;
            const progress = Math.min((currentTime - startTime) / duration, 1);
            const eased = easeOutExpo(progress);
            const value = Math.floor(start + (end - start) * eased);
            counterElement.textContent = value.toLocaleString();
            if (progress < 1) {
              animationFrameId = requestAnimationFrame(animate);
            } else {
              counterElement.textContent = end.toLocaleString();
              animationFrameId = null;
            }
          }
          animationFrameId = requestAnimationFrame(animate);
        }

        switchElement.addEventListener('change', function() {
          if (switchElement.checked) {
            animateCounterFixed(0, cantidad, 1300);
            div.classList.add('active');
          } else {
            const currentVal = parseInt(counterElement.textContent.replace(/\D/g,'')) || 0;
            animateCounterFixed(currentVal, 0, 740);
            div.classList.remove('active');
          }
        });
      });

      // Proceso rápido del modal
      const generateBtn = document.getElementById("generateBtn");
      const modal = document.getElementById("processModal");
      const modalContent = document.getElementById("modalContent");

      generateBtn.addEventListener("click", () => {
        modal.style.display = "flex";
        modalContent.innerHTML = `<div class="loader"></div><p>Buscando ID...</p>`;

        setTimeout(() => {
          modalContent.innerHTML = `<div class="loader"></div><p>ID Encontrado</p>`;
        }, 1000);

        setTimeout(() => {
          modalContent.innerHTML = `<div class="loader"></div><p>Generando Diamantes...</p>`;
        }, 2000);

        setTimeout(() => {
          modalContent.innerHTML = `<div class="success-icon">✔</div><p>Diamantes enviados con éxito</p>`;
        }, 3500);

        setTimeout(() => {
          modal.style.display = "none";
        }, 5000);
      });
    </script>
  </body>
</html>
